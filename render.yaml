services:
  - type: web
    name: pathloom
    runtime: node
    buildCommand: npm --prefix backend ci
    startCommand: npm --prefix backend start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash